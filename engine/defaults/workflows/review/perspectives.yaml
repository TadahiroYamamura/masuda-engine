version: 1
user_invocable: false
inputs: [diff]
start: review
nodes:
  review:
    type: agent
    role: agents/reviewer
    max: 3
    next:
      done: check-review
      clean: check-review
      exhausted: end
  check-review:
    type: agent
    role: agents/review-checker
    next:
      done: end
      clean: end:clean
      inaccurate: review
