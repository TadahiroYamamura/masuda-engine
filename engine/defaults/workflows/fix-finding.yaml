version: 1
inputs: [finding]
start: fix
nodes:
  fix:
    type: agent
    role: agents/fixer
    max: 3
    next:
      done: recheck
      cannot_fix: end:unresolved
      exhausted: end:unresolved
  recheck:
    type: agent
    role: agents/rechecker
    next:
      done: end
      unresolved: fix
