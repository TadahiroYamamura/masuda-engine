version: 1
inputs: [step]
start: implement
nodes:
  implement:
    type: agent
    role: agents/implementer
    max: 3
    next:
      done: test
      stuck: end:stuck
      exhausted: end:stuck
  test:
    type: exec
    command: ["/masuda/checks/test"]
    next:
      done: commit
      failed: implement
  commit:
    type: commit
    scope: step
    next:
      done: end
      rejected: implement
