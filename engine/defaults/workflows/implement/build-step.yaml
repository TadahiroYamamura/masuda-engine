version: 1
inputs: [step]
start: implement
nodes:
  implement:
    type: agent
    role: agents/implementer
    max: 3
    next:
      done: test
      stuck: end:stuck
      exhausted: end:stuck
  test:
    type: exec
    command: ["/masuda/checks/test"]
    next:
      done: review
      failed: implement
  review:
    type: workflow
    workflow: workflows/implement/interim-review
    with:
      diff: step-diff
    next:
      done: fix
      clean: commit
  fix:
    type: agent
    role: agents/fixer
    max: 3
    next:
      done: recheck
      nothing_to_fix: commit
      cannot_fix: approve-interim
      exhausted: approve-interim
  recheck:
    type: agent
    role: agents/rechecker
    next:
      done: commit
      unresolved: fix
      exhausted: approve-interim
  approve-interim:
    type: approval
    gate: interim
    target: step-diff
    next:
      approved: commit
      rejected: implement
  commit:
    type: commit
    scope: step
    next:
      done: end
      rejected: implement
