version: 1
inputs: [diff]
start: interim-review
nodes:
  interim-review:
    type: agent
    role: agents/reviewer
    max: 3
    next:
      done: interim-check
      clean: end:clean
      exhausted: end
  interim-check:
    type: agent
    role: agents/review-checker
    next:
      done: end
      clean: end:clean
      inaccurate: interim-review
