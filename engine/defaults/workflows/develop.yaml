version: 1
inputs: [instructions]
start: investigate
nodes:
  investigate:
    type: agent
    role: agents/investigator
    next: plan
  plan:
    type: agent
    role: agents/planner
    max: 4
    next:
      done: approve-plan
      needs_more_investigation: investigate
      out_of_scope: end:out_of_scope
  approve-plan:
    type: approval
    gate: plan
    target: plan
    next:
      approved: implement
      rejected: plan
  implement:
    type: foreach
    over: steps
    body: workflows/implement/build-step
    next:
      done: review
      stuck: approve-plan
  review:
    type: workflow
    workflow: workflows/review/perspectives
    next:
      done: cross-cutting
      clean: cross-cutting
  cross-cutting:
    type: workflow
    workflow: workflows/review/cross-cutting
    next: fix
  fix:
    type: agent
    role: agents/fixer
    max: 3
    next:
      done: recheck
      cannot_fix: review-commit
      exhausted: review-commit
  recheck:
    type: agent
    role: agents/rechecker
    next:
      done: review-commit
      unresolved: fix
      exhausted: review-commit
  review-commit:
    type: commit
    scope: plan
    next:
      done: report
      rejected: rework
  report:
    type: agent
    role: agents/synthesizer
    next: approve-review
  approve-review:
    type: approval
    gate: review
    target: diff
    next:
      approved: publish
      rejected: rework
  rework:
    type: agent
    role: agents/implementer
    next:
      done: rework-test
      stuck: end:stuck
  rework-test:
    type: exec
    command: ["/masuda/checks/test"]
    next:
      done: rework-commit
      failed: rework
  rework-commit:
    type: commit
    scope: plan
    next:
      done: review
      rejected: rework
  publish:
    type: publish
    export: [report]
    next: end
